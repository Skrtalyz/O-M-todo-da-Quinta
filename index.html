    <!-- Script de Delay VSL (180 segundos / 3 minutos) com persistência em localStorage -->
    <script type="text/javascript">
      (function() {
        var SECONDS_TO_DISPLAY = 180;
        var STORAGE_KEY = 'esconder_delay_liberado';
        var ALREADY_DISPLAYED_KEY = 'alreadyElsDisplayed' + SECONDS_TO_DISPLAY;

        var isAlreadyLiberado = false;
        try {
          isAlreadyLiberado = localStorage.getItem(STORAGE_KEY) === 'true' || 
                              localStorage.getItem(ALREADY_DISPLAYED_KEY) === 'true' ||
                              localStorage.getItem('vsl_delay_liberado') === 'true';
        } catch (e) {}

        var liberadoExecutado = false;
        function liberarConteudo() {
          if (liberadoExecutado) return;
          liberadoExecutado = true;

          // 1. Persistir no localStorage
          try {
            localStorage.setItem(STORAGE_KEY, 'true');
            localStorage.setItem(ALREADY_DISPLAYED_KEY, 'true');
            localStorage.setItem('vsl_delay_liberado', 'true');
          } catch (e) {}

          // 2. Adicionar classe delay-liberado em <html> e <body>
          if (document.documentElement) {
            document.documentElement.classList.add('delay-liberado');
          }
          if (document.body) {
            document.body.classList.add('delay-liberado');
          }

          // 3. Atualizar o style inicial
          var initialStyle = document.getElementById('initial-delay-style');
          if (initialStyle) {
            initialStyle.innerHTML = '.esconder-delay { display: block !important; }';
          }

          // 4. Injetar style com máxima especificidade para garantir exibição
          var override = document.getElementById('delay-style-override');
          if (!override) {
            override = document.createElement('style');
            override.id = 'delay-style-override';
            document.head.appendChild(override);
          }
          override.innerHTML = [
            '.esconder-delay,',
            'body .esconder-delay,',
            'html body .esconder-delay,',
            'div.esconder-delay,',
            'section.esconder-delay {',
            '  display: block !important;',
            '}',
            'button.esconder-delay {',
            '  display: flex !important;',
            '}'
          ].join('\n');

          // 5. Atualizar inline styles nos elementos presentes
          var els = document.querySelectorAll('.esconder-delay');
          for (var i = 0; i < els.length; i++) {
            var el = els[i];
            if (el.tagName && el.tagName.toLowerCase() === 'button') {
              el.style.setProperty('display', 'flex', 'important');
            } else {
              el.style.setProperty('display', 'block', 'important');
            }
          }

          // 6. Notificar componentes React
          window.dispatchEvent(new CustomEvent('vslDelayLiberado'));
        }

        // Se já foi liberado em sessão anterior, liberta imediatamente
        if (isAlreadyLiberado) {
          if (document.documentElement) {
            document.documentElement.classList.add('delay-liberado');
          }
          liberarConteudo();
        } else {
          // Temporizador garantido de 180 segundos (3 minutos)
          setTimeout(function() {
            liberarConteudo();
          }, SECONDS_TO_DISPLAY * 1000);

          // Monitorização do player VTurb (timeupdate e checagem periódica)
          var checkAttempts = 0;
          function setupVTurbProgress() {
            if (liberadoExecutado) return;

            // 1. Checagem via API smartplayer
            if (typeof smartplayer !== 'undefined' && smartplayer.instances && smartplayer.instances.length) {
              try {
                var p = smartplayer.instances[0];
                p.on('timeupdate', function(currentTime) {
                  if (liberadoExecutado) return;
                  var t = typeof currentTime === 'number' ? currentTime : (p.video ? p.video.currentTime : 0);
                  if (t >= SECONDS_TO_DISPLAY) {
                    liberarConteudo();
                  }
                });
              } catch (e) {}
            }

            // 2. Checagem via elemento web-component <vturb-smartplayer>
            var vPlayer = document.getElementById('vid-6aa0c32a7933d7b9d153d93e');
            if (vPlayer) {
              try {
                vPlayer.addEventListener('timeupdate', function(e) {
                  if (liberadoExecutado) return;
                  var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : 0;
                  if (t >= SECONDS_TO_DISPLAY) {
                    liberarConteudo();
                  }
                });
              } catch (e) {}
            }

            if (!liberadoExecutado && checkAttempts < 60) {
              checkAttempts++;
              setTimeout(setupVTurbProgress, 1000);
            }
          }
          setupVTurbProgress();

          // Checagem ativa por intervalo (garante disparo se o vídeo passar dos 180s)
          var vturbInterval = setInterval(function() {
            if (liberadoExecutado) {
              clearInterval(vturbInterval);
              return;
            }
            try {
              if (typeof smartplayer !== 'undefined' && smartplayer.instances && smartplayer.instances.length) {
                var p = smartplayer.instances[0];
                var cur = p.video && typeof p.video.currentTime === 'number' ? p.video.currentTime : 0;
                if (cur >= SECONDS_TO_DISPLAY) {
                  liberarConteudo();
                  clearInterval(vturbInterval);
                }
              }
            } catch (e) {}
          }, 500);
        }

        // Caso o DOM ainda não estivesse pronto
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            if (isAlreadyLiberado || liberadoExecutado) {
              liberarConteudo();
            }
          });
        }
      })();
    </script>
